name: "✨ Demande de fonctionnalité"
description: "Proposer une nouvelle fonctionnalité ou une amélioration."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de proposer une amélioration ! Plus votre demande est précise, plus il sera facile de l'évaluer.

  - type: textarea
    id: problem
    attributes:
      label: Problème à résoudre
      description: Quel problème rencontrez-vous ? À quel besoin cette fonctionnalité répond-elle ?
      placeholder: "Ex. Je suis toujours frustré·e quand [...]"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
      description: Décrivez la fonctionnalité ou le comportement souhaité.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
      description: Avez-vous pensé à d'autres solutions ou contournements ?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priorité perçue
      description: Selon vous, quelle est l'urgence de cette demande ?
      options:
        - Faible (confort)
        - Moyenne (utile à court terme)
        - Élevée (bloquant pour un usage courant)
    validations:
      required: false

  - type: input
    id: context
    attributes:
      label: Contexte additionnel
      description: Lien vers un ticket, une discussion ou une maquette liée, si applicable.
      placeholder: ex. lien vers une Discussion ou un design
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code de conduite
      description: En soumettant cette issue, vous acceptez de respecter notre [Code de conduite](https://github.com/forgelab-dev/.github/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: J'accepte de respecter le Code de conduite de ce projet
          required: true
